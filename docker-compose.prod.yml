services:
  # ============================================================================
  # NGINX - Reverse Proxy — PRODUCCIÓN
  # Solo expone puertos 80 y 443 al host
  # ============================================================================
  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.prod:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - TZ=${TIMEZONE:-UTC}
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================================
  # FRONTEND - Build estático servido por nginx:alpine — PRODUCCIÓN
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${FRONTEND_API_URL}
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_frontend
    environment:
      - TZ=${TIMEZONE:-UTC}
    networks:
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # API - Backend NestJS compilado — PRODUCCIÓN
  # ============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_api
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-3000}
      - TZ=${TIMEZONE:-UTC}
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_URL=${DB_URL}
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_NAME=${MONGO_NAME}
      - MONGO_URL=${MONGO_URL}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - WORKER_URL=http://worker:${WORKER_PORT:-4000}
      - WORKER_SECRET=${WORKER_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_network
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${API_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # WORKER - Python con Flask — PRODUCCIÓN
  # ============================================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_worker
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PORT=${WORKER_PORT:-4000}
      - TZ=${TIMEZONE:-UTC}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - API_URL=http://api:${API_PORT:-3000}
      - RUNNER_TIMEOUT=${RUNNER_TIMEOUT:-10}
      - RUNNER_MEMORY_LIMIT=${RUNNER_MEMORY_LIMIT:-256m}
      - RUNNER_CPU_LIMIT=${RUNNER_CPU_LIMIT:-0.5}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - FLASK_ENV=production
      - WORKER_SECRET=${WORKER_SECRET}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - runner_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:${WORKER_PORT:-4000}/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # REDIS — sin puerto publicado al host
  # ============================================================================
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # MARIADB — sin puerto publicado al host
  # ============================================================================
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.2}
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_HOST=%
      - TZ=${TIMEZONE:-UTC}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=${DB_MAX_CONNECTIONS:-200}
      --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MONGODB — sin puerto publicado al host
  # ============================================================================
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: ${COMPOSE_PROJECT_NAME:-raisecode}_mongodb
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_NAME}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  runner_network:
    driver: bridge

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  mariadb_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
