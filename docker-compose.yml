services:
  # ============================================================================
  # NGINX - Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - TZ=${TIMEZONE:-UTC}
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ============================================================================
  # FRONTEND - SPA con Vite - DESARROLLO
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - NODE_VERSION=${NODE_VERSION:-20}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_frontend
    environment:
      - NODE_ENV=development
      # VITE_ prefix es obligatorio para que Vite exponga la variable al cliente
      - VITE_API_URL=${FRONTEND_API_URL:-http://localhost/api}
      - VITE_PORT=${FRONTEND_INTERNAL_PORT:-5173}
    volumes:
      - ./frontend:/app
      # Volumen anónimo para proteger el node_modules instalado en la imagen
      # sin esto, el bind mount de arriba lo sobreescribiría con la carpeta vacía del host
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-5173}:${FRONTEND_INTERNAL_PORT:-5173}"
    networks:
      - frontend_network
    # npm install por si se añaden dependencias sin reconstruir la imagen
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  # ============================================================================
  # API - Backend NestJS con Yarn - DESARROLLO
  # ============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        - NODE_VERSION=${NODE_VERSION:-20}
        - API_PORT=${API_PORT:-3000}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_api
    environment:
      - NODE_ENV=development
      - PORT=${API_PORT:-3000}
      - TZ=${TIMEZONE:-UTC}
      # MariaDB — usamos las variables del .env directamente, sin re-construir la URL aquí
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-raisecode}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_URL=${DB_URL:-mysql://root:root@mariadb:3306/raisecode}
      # MongoDB
      - MONGO_HOST=${MONGO_HOST:-mongodb}
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_NAME=${MONGO_NAME:-raisecode}
      - MONGO_URL=${MONGO_URL:-mongodb://mongodb:27017/raisecode}
      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # JWT — nombres exactos que usa NestJS en el código
      - JWT_SECRET=${JWT_SECRET:-dev_secret_not_for_production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      # Worker
      - WORKER_URL=http://worker:${WORKER_PORT:-4000}
      - WORKER_SECRET=${WORKER_SECRET:-dev_worker_secret_not_for_production}
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "${API_EXTERNAL_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_network
      - backend_network
    command: sh -c "yarn install && yarn prisma generate && yarn prisma migrate dev && yarn start:dev"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${API_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================================
  # WORKER - Python con Flask - DESARROLLO
  # ============================================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.11}
        - WORKER_PORT=${WORKER_PORT:-4000}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_worker
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PORT=${WORKER_PORT:-4000}
      - TZ=${TIMEZONE:-UTC}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - API_URL=http://api:${API_PORT:-3000}
      - RUNNER_TIMEOUT=${RUNNER_TIMEOUT:-10}
      - RUNNER_MEMORY_LIMIT=${RUNNER_MEMORY_LIMIT:-256m}
      - RUNNER_CPU_LIMIT=${RUNNER_CPU_LIMIT:-0.5}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - WORKER_SECRET=${WORKER_SECRET:-dev_worker_secret_not_for_production}
      - REDIS_URL=redis://${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker:/app
    ports:
      - "${WORKER_EXTERNAL_PORT:-4000}:${WORKER_PORT:-4000}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - runner_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:${WORKER_PORT:-4000}/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # MARIADB
  # ============================================================================
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.2}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_NAME:-raisecode}
      - MYSQL_ROOT_HOST=%
      - TZ=${TIMEZONE:-UTC}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=${DB_MAX_CONNECTIONS:-200}
      --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MONGODB
  # ============================================================================
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: ${COMPOSE_PROJECT_NAME:-code_judge}_mongodb
    environment:
      # Sin credenciales de root: el .env no define MONGO_ROOT_USER/PASSWORD,
      # y la app se conecta sin auth (mongodb://mongodb:27017/raisecode)
      - MONGO_INITDB_DATABASE=${MONGO_NAME:-raisecode}
      - TZ=${TIMEZONE:-UTC}
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  runner_network:
    driver: bridge

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  mariadb_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  api_node_modules:
    driver: local
  frontend_node_modules:
    driver: local