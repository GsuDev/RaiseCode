# ==============================================================================
# Code Judge Platform - Nginx Reverse Proxy Configuration
# ==============================================================================

# Upstream para el Frontend (Vite dev server)
upstream frontend {
    server frontend:5173;
}

# Upstream para la API (NestJS)
upstream api {
    server api:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Tamaño máximo de body
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ==================================================================
    # Health Check
    # ==================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==================================================================
    # API Backend - Proxy a NestJS
    # ==================================================================
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts extendidos
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Sin buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================================
    # Frontend - SPA (Vite dev server)
    # ==================================================================
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support para HMR de Vite (CRÍTICO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Sin buffering para HMR
        proxy_buffering off;
    }
}
