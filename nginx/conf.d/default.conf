# ==============================================================================
# Code Judge Platform - Nginx Reverse Proxy Configuration
# ==============================================================================

# Upstream para el Frontend (Vite dev server)
upstream frontend {
    server frontend:5173;
}

# Upstream para la API (NestJS)
upstream api {
    server api:3000;
}

# ==============================================================================
# SERVER BLOCK 1: HTTP (puerto 80) — Redirección a HTTPS
# ==============================================================================
# Todo el tráfico HTTP se redirige a HTTPS con código 301 (permanente),
# excepto el health check que debe seguir siendo accesible por HTTP para
# que el healthcheck de Docker funcione sin verificación SSL.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Health check accesible por HTTP (necesario para docker healthcheck)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    #Bloquear archivos y rutas sensibles
    location ~ /\.(env|git|htaccess|gitignore|dockerignore) {
        deny all;
        return 403;
    }

    location ~ \.(sql|bak|backup|old|conf|config|log)$ {
        deny all;
        return 403;
    }

    # Redirigir todo lo demás de HTTP → HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 2: HTTPS (puerto 443) — Configuración SSL + Proxy
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # ------------------------------------------------------------------
    # Certificados SSL
    # Generados con: make ssl-certs (o bash nginx/certs/generate-certs.sh)
    # ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ------------------------------------------------------------------
    # Configuración SSL segura
    # - Solo TLS 1.2 y 1.3 (se descartan versiones antiguas e inseguras)
    # - Cifrados seguros, sin null-auth ni MD5
    # - Session cache para mejorar rendimiento en conexiones repetidas
    # ------------------------------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ------------------------------------------------------------------
    # HSTS (HTTP Strict Transport Security)
    # Le dice al navegador que SIEMPRE use HTTPS para este dominio
    # durante 1 año, aunque el usuario escriba http:// manualmente.
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==================================================================
    # Cabeceras de seguridad HTTP
    # ==================================================================

    # X-Frame-Options: DENY
    # Impide que la página se cargue dentro de un <iframe> en cualquier
    # origen. Previene ataques de clickjacking, donde un atacante
    # superpone la app en un iframe invisible para engañar al usuario.
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options: nosniff
    # Evita que el navegador intente "adivinar" el tipo MIME de una
    # respuesta ignorando el Content-Type declarado. Sin esta cabecera,
    # un archivo de texto podría ejecutarse como JS si el navegador lo
    # infiere incorrectamente (MIME sniffing attack).
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: 1; mode=block
    # Activa el filtro XSS integrado en navegadores antiguos (IE, Chrome
    # legacy). Al detectar un ataque XSS reflejado, bloquea la página en
    # lugar de intentar sanearla. Los navegadores modernos usan CSP, pero
    # esta cabecera protege a los usuarios con browsers desactualizados.
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy: strict-origin-when-cross-origin
    # Controla qué información se envía en el header Referer al navegar.
    # - Mismo origen: envía URL completa (path + query).
    # - Origen cruzado con HTTPS→HTTPS: envía solo el origen (dominio).
    # - HTTPS→HTTP (downgrade): no envía nada. Protege datos sensibles
    #   en la URL (tokens, IDs) de filtrarse a sitios de terceros.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy (CSP)
    # Política de seguridad de contenido: define los orígenes válidos
    # desde los que se pueden cargar recursos (scripts, estilos, imágenes,
    # fuentes, conexiones, etc.). Mitiga ataques XSS almacenado y la
    # carga de recursos maliciosos inyectados.
    # - default-src 'self'        → por defecto, solo recursos del mismo origen
    # - script-src  'self' 'unsafe-inline'  → permite scripts inline (necesario para Vite/React)
    # - style-src   'self' 'unsafe-inline'  → permite estilos inline (Chakra UI)
    # - img-src     'self' data:            → permite imágenes locales y data URIs (avatares SVG)
    # - connect-src 'self' wss:             → permite fetch/XHR al propio origen y WebSockets (HMR + Socket.IO)
    # - font-src    'self'                  → fuentes solo del mismo origen
    # - frame-ancestors 'none'              → refuerza X-Frame-Options a nivel CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; frame-ancestors 'none'" always;

    # Permissions-Policy
    # Restringe el acceso a APIs sensibles del navegador.
    # Se desactivan explícitamente las siguientes para que ningún script
    # de la página (incluidos los de terceros inyectados) pueda usarlas:
    # - camera        → acceso a la cámara
    # - microphone    → acceso al micrófono
    # - geolocation   → acceso a la ubicación GPS
    # - payment       → API de pagos del navegador
    # - usb           → acceso a dispositivos USB
    # - fullscreen    → modo pantalla completa sin interacción del usuario
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ==================================================================
    # Health Check
    # ==================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    #Bloquear archivos y rutas sensibles
    location ~ /\.(env|git|htaccess|gitignore|dockerignore) {
        deny all;
        return 403;
    }

    location ~ \.(sql|bak|backup|old|conf|config|log)$ {
        deny all;
        return 403;
    }
        
    # ==================================================================
    # Rate Limiting para Rutas de Autenticación
    # ==================================================================
    location /api/auth/login {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================================================
    # Socket.IO WebSocket - Proxy a NestJS
    # DEBE ir ANTES de /api/ para que nginx lo capture primero
    # ==================================================================
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Obligatorio para upgrade HTTP → WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering — crítico para WS y SSE
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout largo: el socket puede estar abierto ~30s esperando resultado
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ==================================================================
    # API Backend - Proxy a NestJS
    # ==================================================================
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts extendidos
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Sin buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================================
    # Frontend - SPA (Vite dev server)
    # ==================================================================
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support para HMR de Vite (CRÍTICO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Sin buffering para HMR
        proxy_buffering off;
    }
}
