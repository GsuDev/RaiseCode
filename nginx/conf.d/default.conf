# ==============================================================================
# Code Judge Platform - Nginx Reverse Proxy Configuration
# ==============================================================================

# Upstream para el Frontend (Vite dev server)
upstream frontend {
    server frontend:5173;
}

# Upstream para la API (NestJS)
upstream api {
    server api:3000;
}

# ==============================================================================
# SERVER BLOCK 1: HTTP (puerto 80) — Redirección a HTTPS
# ==============================================================================
# Todo el tráfico HTTP se redirige a HTTPS con código 301 (permanente),
# excepto el health check que debe seguir siendo accesible por HTTP para
# que el healthcheck de Docker funcione sin verificación SSL.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Health check accesible por HTTP (necesario para docker healthcheck)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirigir todo lo demás de HTTP → HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 2: HTTPS (puerto 443) — Configuración SSL + Proxy
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # ------------------------------------------------------------------
    # Certificados SSL
    # Generados con: make ssl-certs (o bash nginx/certs/generate-certs.sh)
    # ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ------------------------------------------------------------------
    # Configuración SSL segura
    # - Solo TLS 1.2 y 1.3 (se descartan versiones antiguas e inseguras)
    # - Cifrados seguros, sin null-auth ni MD5
    # - Session cache para mejorar rendimiento en conexiones repetidas
    # ------------------------------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ------------------------------------------------------------------
    # HSTS (HTTP Strict Transport Security)
    # Le dice al navegador que SIEMPRE use HTTPS para este dominio
    # durante 1 año, aunque el usuario escriba http:// manualmente.
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tamaño máximo de body
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ==================================================================
    # Health Check
    # ==================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==================================================================
    # Socket.IO WebSocket - Proxy a NestJS
    # DEBE ir ANTES de /api/ para que nginx lo capture primero
    # ==================================================================
    location /socket.io/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Obligatorio para upgrade HTTP → WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering — crítico para WS y SSE
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeout largo: el socket puede estar abierto ~30s esperando resultado
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ==================================================================
    # API Backend - Proxy a NestJS
    # ==================================================================
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts extendidos
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Sin buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==================================================================
    # Frontend - SPA (Vite dev server)
    # ==================================================================
    location / {
        proxy_pass http://frontend/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support para HMR de Vite (CRÍTICO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Sin buffering para HMR
        proxy_buffering off;
    }
}
